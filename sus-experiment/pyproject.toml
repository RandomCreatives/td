[project]
name = "sus-experiment"
version = "0.1.0"
description = "SUS - An Ephemeral Anonymous Social Experiment"
dependencies = [
    "aiotdlib>=0.14.0",
    "redis>=5.0.0",
    "asyncpg>=0.29.0",
    "apscheduler>=3.10.0",
    "pydantic-settings>=2.1.0",
    "structlog>=24.1.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
